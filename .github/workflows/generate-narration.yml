name: Generate Winter War narration and caption timing draft

on:
  push:
    branches: [main]
    paths:
      - 'episodes/winter-war/narration.md'
      - 'tools/generate_narration.py'
      - '.github/workflows/generate-narration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install system audio dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng libsndfile1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-weight TTS runtime
        run: |
          python -m pip install --upgrade pip
          pip install kokoro soundfile numpy
      - name: Generate narration and chunk timing
        run: |
          python tools/generate_narration.py
          python -m pip freeze > episodes/winter-war/generated/pip-freeze.txt
      - name: Upload narration, captions and runtime manifest
        uses: actions/upload-artifact@v4
        with:
          name: winter-war-narration-and-captions
          path: episodes/winter-war/generated/
          if-no-files-found: error
          retention-days: 30
